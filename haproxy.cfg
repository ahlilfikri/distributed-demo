global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 10s
    timeout server 10s
    retries 3

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend incoming
    bind :8080
    default_backend nodes

backend nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    option redispatch
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server node1 node1:3000 check
    server node2 node2:3000 check
    server node3 node3:3000 check
